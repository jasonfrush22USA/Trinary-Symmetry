<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trinary Symmetry - 3D Channelization</title>
    <style>
        body { margin: 0; background-color: #0f172a; overflow: hidden; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        .overlay-title {
            position: absolute; top: 20px; left: 20px; color: #38bdf8;
            font-size: 1.2rem; font-weight: 600; pointer-events: none; z-index: 10;
        }
    </style>
    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div class="overlay-title">Trinary Symmetry: Dual-Wave Composite Weave</div>
    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0f172a, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(25, 15, 35);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 1. Midline Vector
        const midlineGeo = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(-30, 0, 0), new THREE.Vector3(30, 0, 0)
        ]);
        const midlineMat = new THREE.LineDashedMaterial({ color: 0x94a3b8, dashSize: 0.8, gapSize: 0.4 });
        const midline = new THREE.Line(midlineGeo, midlineMat);
        midline.computeLineDistances();
        scene.add(midline);

        // 2. Upper and Lower Bounding Slope Planes
        const planeGeo = new THREE.PlaneGeometry(60, 20, 30, 10);
        const upperMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true, transparent: true, opacity: 0.15 });
        const lowerMat = new THREE.MeshBasicMaterial({ color: 0xf43f5e, wireframe: true, transparent: true, opacity: 0.15 });

        const upperPlane = new THREE.Mesh(planeGeo, upperMat);
        upperPlane.rotation.x = Math.PI / 2; upperPlane.position.y = 6; upperPlane.rotation.z = 0.08; // Upper Slope
        scene.add(upperPlane);

        const lowerPlane = new THREE.Mesh(planeGeo, lowerMat);
        lowerPlane.rotation.x = Math.PI / 2; lowerPlane.position.y = -6; lowerPlane.rotation.z = -0.08; // Lower Slope
        scene.add(lowerPlane);

        // 3. Dynamic Dual Waves
        const numPoints = 300;
        const wave1Geo = new THREE.BufferGeometry();
        const wave2Geo = new THREE.BufferGeometry();
        const pos1 = new Float32Array(numPoints * 3);
        const pos2 = new Float32Array(numPoints * 3);

        wave1Geo.setAttribute('position', new THREE.BufferAttribute(pos1, 3));
        wave2Geo.setAttribute('position', new THREE.BufferAttribute(pos2, 3));

        const wave1Mat = new THREE.LineBasicMaterial({ color: 0x38bdf8, linewidth: 2 });
        const wave2Mat = new THREE.LineBasicMaterial({ color: 0xa855f7, linewidth: 2 });

        const wave1Line = new THREE.Line(wave1Geo, wave1Mat);
        const wave2Line = new THREE.Line(wave2Geo, wave2Mat);
        scene.add(wave1Line); scene.add(wave2Line);

        // 4. Composite Nodes Group
        const nodesGroup = new THREE.Group();
        const nodeGeo = new THREE.SphereGeometry(0.35, 16, 16);
        const nodeMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });

        for (let i = -20; i <= 20; i += 4) {
            const sphere = new THREE.Mesh(nodeGeo, nodeMat);
            sphere.position.x = i;
            nodesGroup.add(sphere);
        }
        scene.add(nodesGroup);

        // Animation Loop
        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime() * 2;

            const p1 = wave1Geo.attributes.position.array;
            const p2 = wave2Geo.attributes.position.array;

            for (let i = 0; i < numPoints; i++) {
                const x = (i / numPoints) * 60 - 30;
                const phase = x * 0.4 + t;

                // Wave A (Primary)
                p1[i * 3] = x;
                p1[i * 3 + 1] = Math.sin(phase) * 4;
                p1[i * 3 + 2] = Math.cos(phase) * 3;

                // Wave B (Offset / Counter-wave weaving around composites)
                p2[i * 3] = x;
                p2[i * 3 + 1] = Math.sin(phase + Math.PI) * 4;
                p2[i * 3 + 2] = Math.cos(phase + Math.PI) * 3;
            }

            wave1Geo.attributes.position.needsUpdate = true;
            wave2Geo.attributes.position.needsUpdate = true;

            // Animate composite nodes at intersection points
            nodesGroup.children.forEach((node) => {
                const x = node.position.x;
                const phase = x * 0.4 + t;
                node.position.y = 0;
                node.position.z = Math.cos(phase) * 0.5; // Slight orbital wobble
            });

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
